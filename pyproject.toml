[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harnessdev"
version = "0.1.0"
description = "Open framework for evaluating how well LLM agents build and evolve agent harnesses"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
code = ["harbor"]
dev = ["pytest>=8"]

[project.scripts]
harnessdev = "harnessdev.cli:main"
hd = "harnessdev.sandbox_tool:main"

[tool.hatch.build.targets.wheel]
packages = ["harnessdev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
